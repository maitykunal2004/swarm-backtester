[workspace]
resolver = "2"
members = [
    "crates/data",
    "crates/features",
    "crates/models",
    "crates/backtest",
    "crates/tracker",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/maitykunal2004/swarm-backtester"

[workspace.dependencies]
mb-data = { path = "crates/data" }
mb-features = { path = "crates/features" }
mb-models = { path = "crates/models" }
mb-backtest = { path = "crates/backtest" }
mb-tracker = { path = "crates/tracker" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"

# Keep debug builds lean: less disk, faster links, lower peak memory.
[profile.dev]
debug = 0
incremental = true

[profile.test]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
